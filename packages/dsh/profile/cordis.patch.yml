- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-pi-ai
  config:
    providers: {}

- id: agent-default-model
  config:
    provider: e-mate-enterprise
    model: gpt-5.6-luna

- id: agent-loop
  config:
    maxParallelToolCalls: 4

- id: emate-imagegen
  config:
    rootUrl: https://mvdcm.ecoremedia.net/e-mate/model-api/v1

- id: ui-settings-models
  name: '@deepseek-ai/dsh-client-ui-settings-models'
  disabled: true

- id: ui-agent-preset
  name: '@deepseek-ai/dsh-client-ui-agent-preset'
  disabled: false

- id: ui-trajectory
  name: '@deepseek-ai/dsh-client-ui-trajectory'
  disabled: true

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: code

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: danger-full-access

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: never

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    defaultPreset: danger-full-access

# Keep the pinned rc.7 Web seam as the only search path. The enterprise model
# policy projects this device-global credential reference into the native
# Credentials service; no per-session Skill or second provider is required.
- id: web
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  disabled: false
  config:
    apiKeyEnv: E_MATE_SEARCH_KEY_DEEPSEEK
    baseURL: https://api.deepseek.com/anthropic/v1
    model: deepseek-v4-flash

- id: tool-web
  disabled: false
  config:
    fetch: false
    searchTimeoutMs: 60000
    searchMaxResults: 50

- insert:
    - id: emate-settings-document-boundary
      name: ./plugins/settings-document-boundary.js
      inject: [settings]
    - id: emate-credentials-os
      name: ./plugins/credentials-os.js
    - id: emate-health
      name: ./plugins/health.js
      inject: [webServer, jobs]
    - id: emate-general-workspace
      name: ./plugins/general-workspace.js
      inject: [workspaceRegistry]
    - id: emate-artifact-open-boundary
      name: ./plugins/artifact-open-boundary.js
      inject: [apiProxy, workspaceRegistry]
    - id: emate-identity
      name: ./plugins/identity/index.js
      inject: [connection, credentials, timer]
      config:
        providerLegalName: 亦芯
        enterprise:
          authBaseUrl: https://mvdcm.ecoremedia.net/e-mate/auth-api
          modelBaseUrl: https://mvdcm.ecoremedia.net/e-mate/model-api
          clientId: e-mate-web
          organization: emate-v2
    - id: emate-share
      name: ./plugins/share.js
      inject: [apiProxy, connection, credentials]
      config:
        rootUrl: https://mvdcm.ecoremedia.net/e-mate/share
    - id: emate-model-policy
      name: ./plugins/model-policy.js
      inject: [apiProxy, connection, credentials, settings, storageDomain, llm, emateIdentity]
    - id: emate-audit
      name: ./plugins/audit.js
      inject: [connection, sessionPersistence, storageDomain, timer, tools, emateModelPolicy, emateIdentity]
    - id: emate-capabilities
      name: ./plugins/capabilities.js
      inject: [connection]
    - id: emate-qr-generation
      name: ./plugins/qr-generation.js
      inject: [tools, jobs, attachments]
    - id: emate-image-history
      name: ./plugins/image-history.js
      inject: [sessionProjections, sessionProjectionCache, sessionPersistence]

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: emate-schedule-import
      name: ./plugins/schedule-import.js
      inject: [tools]

    - id: emate-legacy-migration
      name: ./plugins/legacy-migration.js
      inject: [sessionPersistence, webServer]

    - id: emate-agent-operations
      name: ./plugins/agent-operations.js
      inject: [systemPrompt, connection, sessions]
