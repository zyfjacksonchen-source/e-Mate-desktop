- insert:
    - id: emate-computer-use
      name: '@e-mate/dsh-plugin-computer-use'
      disabled: !!js Array.of('darwin', 'win32').includes(process.platform) === false
      config:
        observationTtlMs: 0
        interaction:
          focusPolicy: preserve
          keyboardPolicy: preserve
          pointerInputPolicy: targeted
          cursorVisualization: !!js "process.platform === 'win32' ? 'hidden' : 'visible'"
          cursorMotionMs: 0
          cursorAutoHideMs: 0
