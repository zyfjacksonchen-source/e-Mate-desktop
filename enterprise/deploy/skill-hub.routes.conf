# Included inside the existing mvdcm.ecoremedia.net HTTPS server.
# API paths are unchanged; the existing legacy /ecorex-agent/client/ route stays intact.
location = /ecorex-agent/client/skill-hub/v1/healthz {
  proxy_pass http://127.0.0.1:18789/healthz;
  proxy_connect_timeout 3s;
  proxy_read_timeout 5s;
}
location = /ecorex-agent/client/skill-hub/v1 {
  proxy_pass http://127.0.0.1:18789;
  proxy_connect_timeout 3s;
  proxy_read_timeout 45s;
}
location ^~ /ecorex-agent/client/skill-hub/v1/ {
  include /etc/nginx/e-mate-skill-hub-write-mode.conf;
  client_max_body_size 14m;
  proxy_pass http://127.0.0.1:18789;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_connect_timeout 3s;
  proxy_send_timeout 45s;
  proxy_read_timeout 45s;
  proxy_buffering off;
}
